org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Limit worker concurrency to avoid Windows file locking during jar packaging
org.gradle.workers.max=1
org.gradle.caching=true
kotlin.code.style=official
kotlin.incremental=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.native.ignoreDisabledTargets=true
android.useAndroidX=true
android.nonTransitiveRClass=true
compose.experimental.uikit.enabled=true
android.builder.sdkDownload=true
org.gradle.parallel=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.dependency.excludeLibraryComponentsFromConstraints=true
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
android.experimental.enableScreenshotTest=true
android.compose.screenshot.maxHeapSize=4g
#org.gradle.vfs.watch=false
#org.gradle.daemon=false
