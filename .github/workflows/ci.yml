name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle wrapper permissions
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Run static, unit, manifest, screenshot, and Android assembly gates
        run: >-
          ./gradlew spotlessCheck detekt
          :design:verifyComposeResourceParity
          :app-android:verifyAndroidResourceParity
          :app-android:verifyReleaseManifestPermissions
          :shared-network:jvmTest
          :shared-core:testDebugUnitTest
          :shared-database:testDebugUnitTest
          :players:testDebugUnitTest
          :design:testDebugUnitTest
          :app-android:testDebugUnitTest
          :design-screenshots:validateDebugScreenshotTest
          :app-android:assembleDebug
          --stacktrace

      - name: Print failing unit-test reports
        if: failure()
        shell: bash
        run: |
          while IFS= read -r -d '' report; do
            if grep -qE '<(failure|error)' "$report"; then
              echo "::group::$report"
              cat "$report"
              echo "::endgroup::"
            fi
          done < <(find . -path '*/build/test-results/*/TEST-*.xml' -type f -print0)

  android-instrumentation:
    runs-on: ubuntu-latest
    needs: build
    env:
      CI: true
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1024m -Dkotlin.daemon.jvm.options=-Xmx768m"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle wrapper permissions
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install emulator runtime libraries
        run: sudo apt-get update && sudo apt-get install --yes libpulse0

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests on API 35
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: "10.1in WXGA (Tablet)"
          ram-size: 1536M
          emulator-options: "-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics"
          script: ./gradlew :design:connectedDebugAndroidTest :app-android:connectedDebugAndroidTest --max-workers=1 --stacktrace
